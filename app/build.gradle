plugins {
    id 'com.android.application'
}

def releaseKeystore = System.getenv('PROMPTPAD_RELEASE_KEYSTORE')
def releaseAlias = System.getenv('PROMPTPAD_RELEASE_ALIAS')
def releaseStorePassword = System.getenv('PROMPTPAD_RELEASE_STORE_PASSWORD')
def releaseKeyPassword = System.getenv('PROMPTPAD_RELEASE_KEY_PASSWORD')
def hasReleaseSigning = [releaseKeystore, releaseAlias, releaseStorePassword, releaseKeyPassword]
        .every { it != null && !it.trim().isEmpty() }

android {
    namespace 'me.pompel.elauncher'
    compileSdk 36

    signingConfigs {
        promptpadRelease {
            if (hasReleaseSigning) {
                storeFile file(releaseKeystore)
                storePassword releaseStorePassword
                keyAlias releaseAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    defaultConfig {
        applicationId "me.pompel.elauncher"
        minSdk 23
        targetSdk 36
        versionCode 4
        versionName "2.2"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.promptpadRelease
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

gradle.taskGraph.whenReady { taskGraph ->
    if (taskGraph.allTasks.any { it.name.toLowerCase().contains('release') } && !hasReleaseSigning) {
        throw new GradleException('Release builds require PROMPTPAD_RELEASE_* environment variables')
    }
}

androidComponents {
    onVariants(selector().withBuildType('release')) { variant ->
        variant.packaging.jniLibs.excludes.add('**/x86_64/**')
    }
}

dependencies {
    implementation "androidx.recyclerview:recyclerview:1.3.2"
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.preference:preference:1.2.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'

    constraints {
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.0") {
            because("kotlin-stdlib-jdk7 is now a part of kotlin-stdlib")
        }
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.0") {
            because("kotlin-stdlib-jdk8 is now a part of kotlin-stdlib")
        }
    }
}
